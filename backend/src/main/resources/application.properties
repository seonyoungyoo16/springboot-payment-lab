server.address=127.0.0.1
server.port=${APP_PORT:8481}
spring.datasource.url=jdbc:postgresql://127.0.0.1:55453/merchant?connectTimeout=2&socketTimeout=3
spring.datasource.username=paylab
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2500
spring.data.redis.host=127.0.0.1
spring.data.redis.port=56490
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1500ms
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.tomcat.accesslog.enabled=false
logging.level.root=WARN
spring.task.scheduling.pool.size=3
lab.instance=${APP_INSTANCE:A}
lab.key=${LAB_KEY:disabled}
lab.crypto=${PAYMENT_CRYPTO_KEY:disabled}
lab.psp=${PSP_SECRET:disabled}
lab.webhook=${WEBHOOK_SECRET:disabled}
